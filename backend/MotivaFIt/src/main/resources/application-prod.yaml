# =============================================================================
# Perfil: Produção
# =============================================================================
# Sobrescreve application.yaml para o ambiente de produção.
# =============================================================================

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate  # Flyway gerencia as migrations; valida o schema

  flyway:
    enabled: true
    baseline-on-migrate: true

security:
  cookies:
    secure: true
  jwt:
    expiration-minutes: 15
    refresh-expiration-days: 7

# Desabilita devtools em produção
spring.devtools.add-properties: false
