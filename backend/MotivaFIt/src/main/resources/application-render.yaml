# =============================================================================
# Perfil: Render.com (Deploy Gratuito)
# =============================================================================
# Sobrescreve application.yaml para o ambiente Render.com.
# O Render injeta variáveis separadas: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD.
# A URL JDBC é montada a partir dessas variáveis para garantir o formato correto.
# =============================================================================

spring:
  datasource:
    # Monta a URL JDBC usando variáveis separadas do Render para incluir a porta
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update  # permite criar/alterar tabelas automaticamente em teste

  flyway:
    enabled: false  # sem migrations no ambiente de teste

security:
  cookies:
    secure: true  # HTTPS obrigatório no Render
  jwt:
    expiration-minutes: 15
    refresh-expiration-days: 7

# Desabilita devtools
spring.devtools.add-properties: false
