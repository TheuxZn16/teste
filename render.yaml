# =============================================================================
# Render.com — Blueprint de Deploy Automático
# =============================================================================
# Deploy gratuito do MotivaFit com:
#   - PostgreSQL (Free tier, 512 MB)
#   - Backend Spring Boot (Docker Web Service)
#   - Frontend React (Static Site)
#
# Instruções:
#   1. Crie uma conta em https://render.com
#   2. Conecte seu repositório GitHub
#   3. Clique em "Apply" para deploy automático
# =============================================================================

databases:
  # ---------------------------------------------------------------------------
  # Banco de Dados PostgreSQL (Free tier, 512 MB)
  # ---------------------------------------------------------------------------
  - name: motivafit-db
    plan: free
    ipAllowList: []  # apenas conexões internas do Render

services:
  # ---------------------------------------------------------------------------
  # Backend Spring Boot (Docker Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: motivafit-api
    env: docker
    region: oregon
    plan: free
    dockerfilePath: backend/MotivaFIt/Dockerfile
    dockerContext: backend/MotivaFIt
    # O Spring Boot não tem actuator; usa /swagger-ui.html como health check
    # (endpoint público que retorna 200 quando a aplicação está rodando)
    healthCheckPath: /swagger-ui.html
    # O startCommand não é permitido com env: docker.
    # O Dockerfile backend usa CMD que permite sobrescrever os argumentos.
    # O perfil "render" é ativado via SPRING_PROFILES_ACTIVE nas envVars abaixo.
    buildFilter:
      paths:
        - backend/MotivaFIt/**
    envVars:
      # Banco de dados — o Render Postgres fornece variáveis separadas via fromDatabase
      # Usamos host, port, database, user e password para montar a URL JDBC corretamente
      - key: DB_HOST
        fromDatabase:
          name: motivafit-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: motivafit-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: motivafit-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: motivafit-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: motivafit-db
          property: password
      # JWT — Render gera um valor aleatório seguro
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: motivafit-render
      - key: JWT_EXPIRATION_MINUTES
        value: "15"
      - key: JWT_REFRESH_EXPIRATION_DAYS
        value: "7"
      # CORS — deve corresponder EXATAMENTE à URL do frontend
      # O backend valida a origem do navegador contra este valor
      - key: CORS_ALLOWED_ORIGIN
        value: "https://motivafit-front.onrender.com"
      # Cookies seguros (HTTPS obrigatório no Render)
      - key: COOKIE_SECURE
        value: "true"
      # URL base da API para documentação OpenAPI
      - key: OPENAPI_SERVER_URL
        value: "https://motivafit-api.onrender.com"
      # Bootstrap do superusuário (apenas para teste)
      - key: SUPERUSUARIO_EMAIL
        value: "admin@motivafit.com"
      - key: SUPERUSUARIO_SENHA
        value: "SenhaBootstrap123!"
      # JVM — memória reduzida para o plano free (512 MB total)
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx256m -XX:+UseG1GC"
      # Ativa o perfil "render" do Spring Boot (equivalente a --spring.profiles.active=render)
      - key: SPRING_PROFILES_ACTIVE
        value: render

  # ---------------------------------------------------------------------------
  # Frontend React (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: motivafit-front
    env: static
    # Static sites no Render não suportam o campo region.
    buildCommand: "cd frontend/MotivaFit && npm ci && npm run build"
    staticPublishPath: frontend/MotivaFit/dist
    buildFilter:
      paths:
        - frontend/MotivaFit/**
    envVars:
      # URL base da API — o frontend usa esta variável para todas as chamadas
      # Como frontend e backend são serviços separados no Render, a URL deve
      # apontar para o backend com o prefixo /api
      - key: VITE_API_BASE_URL
        value: "https://motivafit-api.onrender.com"
